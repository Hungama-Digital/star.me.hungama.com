services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starme
      POSTGRES_USER: starme
      POSTGRES_PASSWORD: ${STARME_POSTGRES_PASSWORD:-starme_local_only}
    ports:
      - "${STARME_POSTGRES_BIND:-127.0.0.1}:${STARME_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starme -d starme"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - starme_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${STARME_REDIS_BIND:-127.0.0.1}:${STARME_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - starme_redis:/data

  api:
    build: .
    env_file: .env
    environment:
      STARME_DATABASE_URL: postgresql+psycopg://starme:${STARME_POSTGRES_PASSWORD:-starme_local_only}@postgres:5432/starme
      STARME_REDIS_URL: redis://redis:6379/0
      STARME_QUEUE_BACKEND: rq
      STARME_RENDER_PROVIDER: ${STARME_RENDER_PROVIDER:-stub}
      STARME_STORAGE_BACKEND: memory
      STARME_RENDER_WORK_DIR: /renders
    command: ["sh", "-c", "alembic upgrade head && uvicorn starme.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    ports:
      - "${STARME_API_BIND:-127.0.0.1}:${STARME_API_PORT:-8000}:8000"
    volumes:
      # Read-only passthrough media (real show assets). Populated out of band, not in Git.
      - ./media:/media:ro
      # Subscriber portraits, written here when a face is registered from the App.
      - starme_faces:/faces
      # Personalized render outputs, written by the worker and served read-only
      # through /v1/media grants for orders/ keys.
      - starme_renders:/renders:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      STARME_DATABASE_URL: postgresql+psycopg://starme:${STARME_POSTGRES_PASSWORD:-starme_local_only}@postgres:5432/starme
      STARME_REDIS_URL: redis://redis:6379/0
      STARME_QUEUE_BACKEND: rq
      STARME_RENDER_PROVIDER: ${STARME_RENDER_PROVIDER:-stub}
      STARME_STORAGE_BACKEND: memory
      STARME_RENDER_WORK_DIR: /renders
    command: ["rq", "worker", "starme-first-look", "starme-full-render", "starme-seedance", "starme-artwork-swap", "--url", "redis://redis:6379/0"]
    volumes:
      - ./media:/media:ro
      - starme_faces:/faces:ro
      - starme_renders:/renders
    depends_on:
      api:
        condition: service_started

volumes:
  starme_faces:
  starme_postgres:
  starme_redis:
  starme_renders:
