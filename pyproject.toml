[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "starme-backend"
version = "0.1.0"
description = "Provider-neutral foundation for the private StarME prototype"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "byteplus-python-sdk-v2>=3.0.24,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "insightface>=0.7,<0.8",
  "onnxruntime>=1.17,<2",
  "opencv-python-headless>=4.9,<5",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
starme-seedance = "starme.seedance_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/starme"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["starme"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]

# Neither ships type stubs, and both are optional at import time - present in
# the container, absent in a bare checkout. Declaring them here keeps the check
# identical either way, instead of inline ignores that are "unused" wherever
# the package happens to be installed.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "insightface", "insightface.*"]
ignore_missing_imports = true
